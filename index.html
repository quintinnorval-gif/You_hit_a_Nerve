<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro-Sling: Citadel Defense Pro</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 85%; max-width: 450px; z-index: 100;
        }
        button { 
            width: 100%; padding: 16px; margin: 10px 0; border: none; 
            border-radius: 12px; background: #2196F3; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .hidden { display: none !important; }
        #ui { position: absolute; top: 15px; left: 15px; font-weight: bold; pointer-events: none; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; border: 2px solid #2196F3; }
    </style>
</head>
<body>

    <div id="ui">
        Citadel Integrity: <span id="block-count">0</span><br>
        Ammo: <span id="ammo-name">Awaiting Answer</span>
    </div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startDefense()">Initialize Defense</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1 style="color:#4CAF50">VICTORY!</h1>
        <p>The King has been dethroned!</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        const victoryBox = document.getElementById('victory-box');

        const VW = 1000, VH = 600;
        let scale = 1, gameStatus = "MENU"; // MENU, SETTLING, PLAYING, WON
        
        const GRAVITY = 0.22;
        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 24, color: "#9c27b0", shape: "spider", power: 0.14 },
            ASTRO: { name: "Astrocyte", r: 22, color: "#ff9800", shape: "star", power: 0.18 },
            MICRO: { name: "Microglia", r: 18, color: "#f44336", shape: "pulse", power: 0.24 }
        };

        const questionPool = [
            { q: "Which meningeal layer is in direct contact with brain tissue?", a: ["Dura mater", "Arachnoid mater", "Pia mater"], c: 2, type: "OLIGO" },
            { q: "The subarachnoid space contains:", a: ["Blood", "CSF", "Air"], c: 1, type: "ASTRO" },
            { q: "Which cell maintains the Blood-Brain Barrier?", a: ["Astrocyte", "Microglia", "Neuron"], c: 0, type: "ASTRO" },
            { q: "Which cell produces myelin in the CNS?", a: ["Schwann", "Oligodendrocyte", "Astrocyte"], c: 1, type: "OLIGO" },
            { q: "The primary motor cortex is in which lobe?", a: ["Frontal", "Parietal", "Occipital"], c: 0, type: "ASTRO" }
        ];

        let blocks = [], particles = [], ammo = null, shuffleDeck = [];
        let isDragging = false, mousePos = {x:0, y:0};
        let king = { x: 0, y: -100, r: 35, vy: 0 };
        const slingPos = { x: 180, y: VH - 180 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scale = Math.min(canvas.width / VW, canvas.height / VH);
        }

        function toVirtual(rx, ry) {
            return {
                x: (rx - (canvas.width - VW * scale) / 2) / scale,
                y: (ry - (canvas.height - VH * scale) / 2) / scale
            };
        }

        function startDefense() {
            gameStatus = "SETTLING";
            quizBox.classList.add('hidden');
            initCitadel();
            setTimeout(() => { if(gameStatus === "SETTLING") { gameStatus = "PLAYING"; nextQuestion(); } }, 2000);
        }

        function resetGame() { location.reload(); }

        function initCitadel() {
            blocks = []; king.y = -100; king.vy = 0;
            for(let i=0; i<5; i++) {
                for(let j=0; j<2; j++) {
                    blocks.push({ x: VW-250+(j*65), y: -100 - (i*60), w: 55, h: 55, alive: true, col: j });
                }
            }
            updateUI();
        }

        function restoreBlock() {
            const counts = [blocks.filter(b=>b.col===0 && b.alive).length, blocks.filter(b=>b.col===1 && b.alive).length];
            const col = counts[0] <= counts[1] ? 0 : 1;
            blocks.push({ x: VW-250+(col*65), y: -100, w: 55, h: 55, alive: true, col: col });
            updateUI();
        }

        function nextQuestion() {
            if (gameStatus !== "PLAYING") return;
            if (shuffleDeck.length === 0) shuffleDeck = [...questionPool].sort(() => Math.random() - 0.5);
            quizBox.classList.remove('hidden');
            const data = shuffleDeck.pop();
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else {
                        restoreBlock();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function drawCell(type, x, y, isAngry) {
            ctx.fillStyle = type.color; ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.beginPath();
            if(type.shape === "spider") {
                for(let i=0; i<8; i++) {
                    let a = (i/8)*Math.PI*2 + (isAngry ? Date.now()*0.02 : 0);
                    ctx.lineTo(x + Math.cos(a)*type.r*1.4, y + Math.sin(a)*type.r*1.4); ctx.lineTo(x, y);
                }
            } else if(type.shape === "star") {
                for(let i=0; i<10; i++) {
                    let a = (i/10)*Math.PI*2; let r = i%2===0 ? type.r : type.r/2;
                    ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
                }
            } else { ctx.arc(x, y, type.r, 0, 7); }
            ctx.fill(); ctx.stroke();
            const r = type.r; ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(x - r/3, y - r/5, r/6, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(x + r/3, y - r/5, r/6, 0, 7); ctx.fill();
            if(isAngry) {
                ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x - r/2, y - r/2); ctx.lineTo(x - r/10, y - r/4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + r/2, y - r/2); ctx.lineTo(x + r/10, y - r/4); ctx.stroke();
            }
        }

        function drawKing(k) {
            ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7); ctx.fill();
            ctx.fillStyle = "gold"; ctx.fillRect(k.x-15, k.y-45, 30, 15);
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(k.x-10, k.y-5, 8, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(k.x+10, k.y-5, 8, 0, 7); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(k.x-10, k.y-5, 3, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(k.x+10, k.y-5, 3, 0, 7); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(k.x, k.y+10, 10, 3.5, 5.8); ctx.stroke();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate((canvas.width - VW*scale)/2, (canvas.height - VH*scale)/2);
            ctx.scale(scale, scale);

            // Ground & Sling
            ctx.fillStyle = "#5d4037"; ctx.fillRect(-500, VH-50, VW+1000, 500); 
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 8; ctx.beginPath();
            ctx.moveTo(slingPos.x, VH-50); ctx.lineTo(slingPos.x, slingPos.y+20); ctx.stroke();

            // Blocks
            blocks.forEach(b => {
                if(!b.alive) return;
                const colBlocks = blocks.filter(bl => bl.col === b.col && bl.alive).sort((a,b) => b.y - a.y);
                const targetY = VH - 105 - (colBlocks.indexOf(b)*58);
                if(b.y < targetY) b.y += 7; else b.y = targetY;
                ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = "#263238"; ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            // King
            const top = blocks.filter(b=>b.alive).sort((a,b)=>a.y-b.y)[0];
            if(top) {
                king.x = top.x + 27;
                if(king.y < top.y - 40) { king.vy += GRAVITY; king.y += king.vy; }
                else { king.y = top.y - 40; king.vy = 0; }
            } else { king.vy += GRAVITY; king.y += king.vy; }

            if(gameStatus !== "WON") {
                drawKing(king);
                if(gameStatus === "PLAYING" && king.y > VH-85) {
                    gameStatus = "WON";
                    for(let i=0; i<60; i++) particles.push({ x: king.x, y: king.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, size: Math.random()*5+2, color: `hsl(${Math.random()*360}, 70%, 60%)` });
                    setTimeout(() => victoryBox.classList.remove('hidden'), 1000);
                }
            }

            // Ammo & Trajectory
            if(ammo && gameStatus === "PLAYING") {
                if(isDragging) {
                    ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.strokeStyle = "white";
                    let px = slingPos.x, py = slingPos.y, pvx = (slingPos.x-mousePos.x)*ammo.type.power, pvy = (slingPos.y-mousePos.y)*ammo.type.power;
                    for(let i=0; i<30; i++) { ctx.lineTo(px, py); pvy+=GRAVITY; px+=pvx; py+=pvy; }
                    ctx.stroke(); ctx.setLineDash([]);
                    drawCell(ammo.type, mousePos.x, mousePos.y, false);
                } else if(ammo.active) {
                    ammo.vy += GRAVITY; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y, true);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) { b.alive = false; updateUI(); }
                    });
                    if(ammo.y > VH || ammo.x > VW || ammo.x < 0) { ammo = null; setTimeout(nextQuestion, 600); }
                } else { drawCell(ammo.type, slingPos.x, slingPos.y, false); }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.y > VH) particles.splice(i,1);
            });

            ctx.restore();
            requestAnimationFrame(update);
        }

        canvas.addEventListener('mousedown', e => {
            if(gameStatus !== "PLAYING" || !ammo) return;
            const p = toVirtual(e.clientX, e.clientY);
            if(Math.hypot(p.x-slingPos.x, p.y-slingPos.y) < 60) isDragging = true;
        });
        window.addEventListener('mousemove', e => { if(isDragging) mousePos = toVirtual(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => {
            if(!isDragging) return; isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.active = true;
        });
        // Same for touch...
        canvas.addEventListener('touchstart', e => {
            if(gameStatus !== "PLAYING" || !ammo) return;
            const p = toVirtual(e.touches[0].clientX, e.touches[0].clientY);
            if(Math.hypot(p.x-slingPos.x, p.y-slingPos.y) < 60) isDragging = true;
        });
        window.addEventListener('touchmove', e => { if(isDragging) mousePos = toVirtual(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => {
            if(!isDragging) return; isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.active = true;
        });

        function updateUI() { document.getElementById('block-count').innerText = blocks.filter(b=>b.alive).length; }
        window.addEventListener('resize', resize);
        resize(); update();
    </script>
</body>
</html>
