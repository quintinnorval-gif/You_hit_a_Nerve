<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro-Sling: Citadel Defense Pro</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 85%; max-width: 400px; z-index: 100;
        }

        #rotate-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2196F3; color: white; z-index: 999; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        @media (orientation: portrait) { #rotate-notice { display: flex; } }

        button { 
            width: 100%; padding: 14px; margin: 8px 0; border: none; 
            border-radius: 12px; background: #2196F3; color: white; font-size: 17px; font-weight: bold; cursor: pointer;
        }

        .hidden { display: none !important; }
        #ui { position: absolute; top: 15px; left: 15px; font-size: 14px; font-weight: bold; pointer-events: none; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 10px; }
        #victory-box h1 { color: #4CAF50; margin-top: 0; }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <h2>Rotate for Battle!</h2>
        <p>Please switch to Landscape mode to see the full battlefield.</p>
    </div>

    <div id="ui">
        Citadel Integrity: <span id="block-count">0</span><br>
        Ammo: <span id="ammo-name">Awaiting Answer</span>
    </div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startDefense()">Initialize Defense</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1>VICTORY!</h1>
        <p>The King's citadel has been dismantled by your knowledge.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        const victoryBox = document.getElementById('victory-box');

        let W, H, S; // Width, Height, Scale
        let slingPos = { x: 0, y: 0 }, mousePos = { x: 0, y: 0 };
        let shuffleDeck = [], particles = [], gameActive = true;
        let ammo = null, blocks = [], isDragging = false;
        let king = { x: 0, y: 0, r: 0, vy: 0 };

        const GRAVITY = 0.22;
        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 24, color: "#9c27b0", shape: "spider", power: 0.13 },
            ASTRO: { name: "Astrocyte", r: 20, color: "#ff9800", shape: "star", power: 0.17 },
            MICRO: { name: "Microglia", r: 15, color: "#f44336", shape: "pulse", power: 0.23 }
        };

        const questionPool = [
            { q: "Which meningeal layer is in direct contact with the brain tissue?", a: ["Dura mater", "Arachnoid mater", "Pia mater"], c: 2, type: "OLIGO" },
            { q: "Which cell produces CSF in the choroid plexus?", a: ["Microglia", "Astrocyte", "Ependymal cell"], c: 2, type: "ASTRO" },
            { q: "Which cell maintains the Blood-Brain Barrier (BBB)?", a: ["Astrocyte", "Oligodendrocyte", "Schwann cell"], c: 0, type: "ASTRO" },
            { q: "Neurons with one axon and many dendrites are:", a: ["Bipolar", "Unipolar", "Multipolar"], c: 2, type: "OLIGO" },
            { q: "Cranial Nerve X (10), which wanders to the thorax, is the:", a: ["Vagus", "Trigeminal", "Abducens"], c: 0, type: "MICRO" },
            { q: "The primary motor cortex is located in which lobe?", a: ["Frontal", "Parietal", "Occipital"], c: 0, type: "ASTRO" },
            { q: "Which structure connects the left and right hemispheres?", a: ["Thalamus", "Corpus Callosum", "Pons"], c: 1, type: "OLIGO" }
        ];

        function setupSizing() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            
            // S acts as a multiplier for all sizes (S=1 for desktop, S~0.6 for phones)
            S = Math.min(W / 1000, H / 500); 
            
            slingPos.x = W * 0.15; // Anchor at 15% width
            slingPos.y = H - (150 * S);
            king.r = 35 * S;

            if (blocks.length === 0) initCitadel();
        }

        function initCitadel() {
            blocks = []; king.vy = 0;
            const cols = 2, layers = 5;
            const bW = 50 * S, bH = 55 * S;
            const startX = W * 0.75; // Anchor at 75% width
            for(let i=0; i<layers; i++) {
                for(let j=0; j<cols; j++) {
                    blocks.push({ 
                        x: startX + (j * (bW + 10 * S)), 
                        y: H - 110 * S - (i * (bH + 5 * S)), 
                        w: bW, h: bH, alive: true, col: j 
                    });
                }
            }
            updateUI();
        }

        function restoreBlock() {
            const counts = [
                blocks.filter(b => b.col === 0 && b.alive).length,
                blocks.filter(b => b.col === 1 && b.alive).length
            ];
            const targetCol = counts[0] <= counts[1] ? 0 : 1;
            const colBlocks = blocks.filter(b => b.col === targetCol && b.alive);
            const highestY = colBlocks.length > 0 ? Math.min(...colBlocks.map(b => b.y)) : H - 50;
            const bW = 50 * S, bH = 55 * S;

            blocks.push({ 
                x: (W * 0.75) + (targetCol * (bW + 10 * S)), 
                y: highestY - (bH + 5 * S), 
                w: bW, h: bH, alive: true, col: targetCol 
            });
            updateUI();
        }

        function drawCell(type, x, y, isAngry) {
            ctx.fillStyle = type.color; ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.beginPath();
            const r = type.r * S;
            if(type.shape === "spider") {
                for(let i=0; i<8; i++) {
                    let a = (i/8)*Math.PI*2 + (isAngry ? Date.now()*0.01 : 0);
                    ctx.lineTo(x + Math.cos(a)*r*1.4, y + Math.sin(a)*r*1.4); ctx.lineTo(x, y);
                }
            } else if(type.shape === "star") {
                for(let i=0; i<10; i++) {
                    let a = (i/10)*Math.PI*2; let radius = i%2===0 ? r : r/2;
                    ctx.lineTo(x + Math.cos(a)*radius, y + Math.sin(a)*radius);
                }
            } else { ctx.arc(x, y, r, 0, Math.PI*2); }
            ctx.fill(); ctx.stroke();

            // Eyes
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(x - r/3, y - r/5, r/6, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(x + r/3, y - r/5, r/6, 0, 7); ctx.fill();
        }

        function drawKing(k) {
            ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7); ctx.fill();
            ctx.fillStyle = "gold"; ctx.fillRect(k.x - 15 * S, k.y - 45 * S, 30 * S, 15 * S);
            ctx.strokeStyle = "white"; ctx.lineWidth = 3 * S; ctx.beginPath(); ctx.arc(k.x, k.y + k.r/3, k.r/4, 3.8, 5.6); ctx.stroke();
        }

        function drawPrediction(vx, vy) {
            ctx.beginPath(); ctx.setLineDash([5, 8]); ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            let px = slingPos.x, py = slingPos.y, pvx = vx, pvy = vy;
            for(let i=0; i<40; i++) {
                ctx.lineTo(px, py); pvy += GRAVITY; px += pvx; py += pvy;
                if(py > H - 50) break;
            }
            ctx.stroke(); ctx.setLineDash([]);
        }

        function update() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = "#5d4037"; ctx.fillRect(0, H - 50, W, 50);
            
            // Slingshot
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 10 * S; ctx.beginPath();
            ctx.moveTo(slingPos.x, H - 50); ctx.lineTo(slingPos.x, slingPos.y + 20 * S); ctx.stroke();

            // Block Physics & Drawing
            let topY = H; let topBlock = null;
            blocks.forEach(b => {
                if(b.alive) {
                    ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#263238"; ctx.strokeRect(b.x, b.y, b.w, b.h);
                    if(b.y < topY) { topY = b.y; topBlock = b; }
                }
            });

            // King logic
            if(topBlock) {
                king.x = topBlock.x + (topBlock.w / 2);
                if(king.y < topBlock.y - 45 * S) { king.vy += GRAVITY; king.y += king.vy; }
                else { king.y = topBlock.y - 45 * S; king.vy = 0; }
            } else { king.vy += GRAVITY; king.y += king.vy; }

            if (gameActive) {
                drawKing(king);
                if(king.y >= H - 85 * S) triggerExplosion();
            }

            // Ammo
            if(ammo && gameActive) {
                if(isDragging) {
                    let vx = (slingPos.x - mousePos.x) * ammo.type.power;
                    let vy = (slingPos.y - mousePos.y) * ammo.type.power;
                    drawPrediction(vx, vy);
                    ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.beginPath();
                    ctx.moveTo(slingPos.x, slingPos.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
                    drawCell(ammo.type, mousePos.x, mousePos.y, false);
                } else if(ammo.active) {
                    ammo.vy += GRAVITY; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y, true);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) {
                            b.alive = false; updateUI();
                        }
                    });
                    if(ammo.y > H || ammo.x > W || ammo.x < 0) {
                        ammo = null; setTimeout(nextQuestion, 600);
                    }
                } else { drawCell(ammo.type, slingPos.x, slingPos.y, false); }
            }

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.1;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.y > H) particles.splice(i, 1);
            });

            requestAnimationFrame(update);
        }

        // Shared Input Logic
        function handleStart(ex, ey) { if(gameActive && ammo && !ammo.launched) { isDragging = true; mousePos = {x: ex, y: ey}; } }
        function handleMove(ex, ey) { if(isDragging) mousePos = {x: ex, y: ey}; }
        function handleEnd() {
            if(!isDragging) return;
            isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.launched = true; ammo.active = true;
        }

        canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('touchmove', e => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', handleEnd);

        function startDefense() { quizBox.classList.add('hidden'); nextQuestion(); }
        function resetGame() { location.reload(); }
        function updateUI() { document.getElementById('block-count').innerText = blocks.filter(b => b.alive).length; }
        
        function nextQuestion() {
            if (!gameActive) return;
            if (shuffleDeck.length === 0) shuffleDeck = [...questionPool].sort(() => Math.random() - 0.5);
            quizBox.classList.remove('hidden');
            const data = shuffleDeck.pop();
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, launched:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else {
                        restoreBlock();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function triggerExplosion() {
            gameActive = false;
            for(let i=0; i<80; i++) {
                particles.push({
                    x: king.x, y: king.y,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 2, color: `hsl(${Math.random() * 360}, 80%, 60%)`
                });
            }
            setTimeout(() => { victoryBox.classList.remove('hidden'); }, 1200);
        }

        window.addEventListener('resize', setupSizing);
        setupSizing();
        update();
    </script>
</body>
</html>
