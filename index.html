<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=none">
    <title>Neuro-Sling: Citadel Defense Pro</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 85%; max-width: 450px; z-index: 100;
        }
        button { 
            width: 100%; padding: 16px; margin: 10px 0; border: none; 
            border-radius: 12px; background: #2196F3; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .hidden { display: none !important; }
        #ui { position: absolute; top: 15px; left: 15px; font-weight: bold; pointer-events: none; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 10px; }
        #victory-box h1 { color: #4CAF50; margin-top: 0; }
    </style>
</head>
<body>

    <div id="ui">
        Citadel Integrity: <span id="block-count">0</span><br>
        Ammo: <span id="ammo-name">Awaiting Answer</span>
    </div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startDefense()">Initialize Defense</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1>VICTORY!</h1>
        <p>The King's citadel has been dismantled by your knowledge.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        const victoryBox = document.getElementById('victory-box');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const GRAVITY = 0.22;
        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 24, color: "#9c27b0", shape: "spider", power: 0.13 },
            ASTRO: { name: "Astrocyte", r: 20, color: "#ff9800", shape: "star", power: 0.17 },
            MICRO: { name: "Microglia", r: 15, color: "#f44336", shape: "pulse", power: 0.23 }
        };

        const questionPool = [
            { q: "Which meningeal layer is in direct contact with the brain tissue?", a: ["Dura mater", "Arachnoid mater", "Pia mater"], c: 2, type: "OLIGO" },
            { q: "The subarachnoid space is located between:", a: ["Dura and Arachnoid", "Arachnoid and Pia", "Pia and Grey Matter"], c: 1, type: "ASTRO" },
            { q: "Which layer forms the tough, fibrous outer covering of the CNS?", a: ["Dura mater", "Pia mater", "Periosteum"], c: 0, type: "MICRO" },
            { q: "Which cell produces CSF in the choroid plexus?", a: ["Microglia", "Astrocyte", "Ependymal cell"], c: 2, type: "ASTRO" },
            { q: "Which cell maintains the Blood-Brain Barrier (BBB)?", a: ["Astrocyte", "Oligodendrocyte", "Schwann cell"], c: 0, type: "ASTRO" },
            { q: "Phagocytic cells that act as brain immune defense are:", a: ["Satellite cells", "Microglia", "Ependymal cells"], c: 1, type: "MICRO" },
            { q: "Oligodendrocytes myelinate axons in the:", a: ["CNS", "PNS", "Enteric System"], c: 0, type: "OLIGO" },
            { q: "Neurons with one axon and many dendrites are:", a: ["Bipolar", "Unipolar", "Multipolar"], c: 2, type: "OLIGO" },
            { q: "Sensory neurons in dorsal root ganglia are typically:", a: ["Pseudounipolar", "Multipolar", "Anaxonic"], c: 0, type: "MICRO" },
            { q: "The 'Fight or Flight' response is governed by the:", a: ["Parasympathetic", "Sympathetic", "Somatic"], c: 1, type: "MICRO" },
            { q: "Cranial nerves and spinal nerves are part of the:", a: ["CNS", "PNS", "Autonomic Only"], c: 1, type: "OLIGO" },
            { q: "How many pairs of spinal nerves are in the human body?", a: ["12", "31", "33"], c: 1, type: "ASTRO" },
            { q: "Cranial Nerve X (10), which wanders to the thorax, is the:", a: ["Vagus", "Trigeminal", "Abducens"], c: 0, type: "MICRO" },
            { q: "Which cranial nerve is responsible for vision?", a: ["Olfactory (I)", "Optic (II)", "Oculomotor (III)"], c: 1, type: "OLIGO" },
            { q: "The Trigeminal nerve (V) is primarily responsible for:", a: ["Eye movement", "Facial sensation", "Hearing"], c: 1, type: "ASTRO" },
            { q: "The primary motor cortex is located in which lobe?", a: ["Frontal", "Parietal", "Occipital"], c: 0, type: "ASTRO" },
            { q: "The postcentral gyrus contains the:", a: ["Motor cortex", "Somatosensory cortex", "Visual cortex"], c: 1, type: "ASTRO" },
            { q: "Which structure connects the left and right hemispheres?", a: ["Thalamus", "Corpus Callosum", "Pons"], c: 1, type: "OLIGO" },
            { q: "The 'folds' on the brain surface are called:", a: ["Gyri", "Sulci", "Fissures"], c: 0, type: "MICRO" },
            { q: "The shallow grooves between folds are called:", a: ["Gyri", "Sulci", "Ventricles"], c: 1, type: "ASTRO" },
            { q: "Where is CSF primarily reabsorbed into the blood?", a: ["Choroid plexus", "Arachnoid villi", "Central canal"], c: 1, type: "OLIGO" },
            { q: "Which ventricle is located between the cerebellar hemispheres?", a: ["Lateral", "Third", "Fourth"], c: 2, type: "MICRO" },
            { q: "CSF flows from the 3rd to 4th ventricle via the:", a: ["Interventricular foramen", "Cerebral aqueduct", "Median aperture"], c: 1, type: "ASTRO" },
            { q: "In the spinal cord, white matter is located:", a: ["Internally (H-shape)", "Externally", "Only in the center"], c: 1, type: "OLIGO" },
            { q: "The tapered end of the spinal cord (L1/L2) is the:", a: ["Cauda equina", "Conus medullaris", "Filum terminale"], c: 1, type: "MICRO" },
            { q: "Which system is 'Rest and Digest'?", a: ["Sympathetic", "Parasympathetic", "Somatic"], c: 1, type: "ASTRO" },
            { q: "The area of the brain responsible for speech production:", a: ["Wernicke's", "Broca's", "Insula"], c: 1, type: "MICRO" },
            { q: "The lobe responsible for auditory processing:", a: ["Frontal", "Temporal", "Occipital"], c: 1, type: "OLIGO" },
            { q: "What ions move IN to trigger an action potential?", a: ["Potassium", "Sodium", "Chloride"], c: 1, type: "ASTRO" },
            { q: "Which cranial nerve moves the tongue?", a: ["Glossopharyngeal", "Hypoglossal", "Accessory"], c: 1, type: "MICRO" }
        ];

        let shuffleDeck = [], particles = [], gameActive = true;
        let ammo = null, blocks = [], isDragging = false;
        let king = { x: 0, y: 0, r: 35, vy: 0 };
        let slingPos = { x: 180, y: canvas.height - 220 }, mousePos = { x: 180, y: canvas.height - 220 };

        function startDefense() {
            initCitadel();
            nextQuestion();
        }

        function resetGame() {
            victoryBox.classList.add('hidden');
            gameActive = true;
            particles = [];
            initCitadel();
            nextQuestion();
        }

        function initCitadel() {
            blocks = []; king.vy = 0;
            const cols = 2, layers = 5;
            for(let i=0; i<layers; i++) {
                for(let j=0; j<cols; j++) {
                    blocks.push({ x: canvas.width - 250 + (j*60), y: canvas.height - 110 - (i*60), w: 50, h: 55, alive: true, col: j });
                }
            }
            updateUI();
        }

        function restoreBlock() {
            // Find the column with the fewest blocks to keep the tower balanced
            const col0Count = blocks.filter(b => b.col === 0 && b.alive).length;
            const col1Count = blocks.filter(b => b.col === 1 && b.alive).length;
            const targetCol = col0Count <= col1Count ? 0 : 1;
            
            // Find the highest Y (lowest number) in that column
            const colBlocks = blocks.filter(b => b.col === targetCol && b.alive);
            const highestY = colBlocks.length > 0 
                ? Math.min(...colBlocks.map(b => b.y)) 
                : canvas.height - 50;

            // Add a brand new block above the current top
            blocks.push({ 
                x: canvas.width - 250 + (targetCol * 60), 
                y: highestY - 60, 
                w: 50, h: 55, 
                alive: true, 
                col: targetCol 
            });
            updateUI();
        }

        function nextQuestion() {
            if (!gameActive) return;
            if (shuffleDeck.length === 0) shuffleDeck = [...questionPool].sort(() => Math.random() - 0.5);
            
            quizBox.classList.remove('hidden');
            const data = shuffleDeck.pop();
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';

            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, launched:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else { 
                        alert("Incorrect! The King reinforces his tower!");
                        restoreBlock();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function triggerExplosion() {
            gameActive = false;
            for(let i=0; i<100; i++) {
                particles.push({
                    x: king.x, y: king.y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 2,
                    color: `hsl(${Math.random() * 360}, 80%, 60%)`,
                    type: 'confetti'
                });
            }
            setTimeout(() => { victoryBox.classList.remove('hidden'); }, 1500);
        }

        function updateUI() {
            document.getElementById('block-count').innerText = blocks.filter(b => b.alive).length;
        }

        function drawPrediction(vx, vy) {
            ctx.beginPath(); ctx.setLineDash([5, 8]); ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            let px = slingPos.x, py = slingPos.y, pvx = vx, pvy = vy;
            for(let i=0; i<45; i++) {
                ctx.lineTo(px, py); pvx *= 1.0; pvy += GRAVITY; px += pvx; py += pvy;
                if(py > canvas.height - 50) break;
            }
            ctx.stroke(); ctx.setLineDash([]);
        }

        function drawCell(type, x, y, isAngry) {
            ctx.fillStyle = type.color; ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.beginPath();
            if(type.shape === "spider") {
                for(let i=0; i<8; i++) {
                    let a = (i/8)*Math.PI*2 + (isAngry ? Date.now()*0.01 : 0);
                    ctx.lineTo(x + Math.cos(a)*type.r*1.4, y + Math.sin(a)*type.r*1.4); ctx.lineTo(x, y);
                }
            } else if(type.shape === "star") {
                for(let i=0; i<10; i++) {
                    let a = (i/10)*Math.PI*2; let r = i%2===0 ? type.r : type.r/2;
                    ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
                }
            } else { ctx.arc(x, y, type.r, 0, Math.PI*2); }
            ctx.fill(); ctx.stroke();

            const r = type.r;
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(x - r/3, y - r/5, r/6, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(x + r/3, y - r/5, r/6, 0, 7); ctx.fill();
            ctx.strokeStyle = "black"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x - r/2, y - r/2); ctx.lineTo(x - r/10, y - r/4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + r/2, y - r/2); ctx.lineTo(x + r/10, y - r/4); ctx.stroke();
        }

        function drawKing(k) {
            ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7); ctx.fill();
            ctx.fillStyle = "gold"; ctx.fillRect(k.x-15, k.y-45, 30, 15);
            const r = k.r;
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(k.x - r/3, k.y - r/6, r/4, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(k.x + r/3, k.y - r/6, r/4, 0, 7); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(k.x - r/3, k.y - r/6, r/10, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(k.x + r/3, k.y - r/6, r/10, 0, 7); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(k.x, k.y + r/3, r/4, 3.8, 5.6); ctx.stroke();
        }

        canvas.addEventListener('mousedown', (e) => { if(gameActive && ammo && !ammo.launched) isDragging = true; });
        canvas.addEventListener('mousemove', (e) => { if(isDragging) mousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mouseup', () => {
            if(isDragging) {
                isDragging = false;
                ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
                ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
                ammo.launched = true; ammo.active = true;
            }
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => { 
            if(gameActive && ammo && !ammo.launched) {
                isDragging = true;
                mousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        canvas.addEventListener('touchmove', (e) => { 
            if(isDragging) mousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY }; 
        });
        window.addEventListener('touchend', () => {
            if(isDragging) {
                isDragging = false;
                ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
                ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
                ammo.launched = true; ammo.active = true;
            }
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#5d4037"; ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 10; ctx.beginPath();
            ctx.moveTo(slingPos.x, canvas.height-50); ctx.lineTo(slingPos.x, slingPos.y+20); ctx.stroke();

            // Physics for blocks (falling into place)
            for (let c = 0; c < 2; c++) {
                let colItems = blocks.filter(b => b.col === c && b.alive).sort((a,b) => b.y - a.y);
                colItems.forEach((b, idx) => {
                    let targetY = canvas.height - 110 - (idx * 60);
                    if (b.y < targetY) b.y += 5; 
                    else b.y = targetY;
                });
            }

            let topY = canvas.height; let topBlock = null;
            blocks.forEach(b => {
                if(b.alive) {
                    ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#263238"; ctx.strokeRect(b.x, b.y, b.w, b.h);
                    if(b.y < topY) { topY = b.y; topBlock = b; }
                }
            });

            if(topBlock) {
                king.x = topBlock.x + 25;
                if(king.y < topBlock.y - 45) { king.vy += GRAVITY; king.y += king.vy; }
                else { king.y = topBlock.y - 45; king.vy = 0; }
            } else {
                king.vy += GRAVITY; king.y += king.vy;
            }
            
            if (gameActive) { drawKing(king); }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.1;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.y > canvas.height) particles.splice(i, 1);
            });

            if (gameActive && king.y >= canvas.height - 85) { triggerExplosion(); }

            if(ammo && gameActive) {
                if(isDragging) {
                    let vx = (slingPos.x - mousePos.x) * ammo.type.power;
                    let vy = (slingPos.y - mousePos.y) * ammo.type.power;
                    drawPrediction(vx, vy);
                    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 4; ctx.beginPath();
                    ctx.moveTo(slingPos.x, slingPos.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
                    drawCell(ammo.type, mousePos.x, mousePos.y, false);
                } else if(ammo.active) {
                    ammo.vy += GRAVITY; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y, true);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) {
                            b.alive = false; updateUI();
                        }
                    });
                    if(ammo.y > canvas.height || ammo.x > canvas.width || ammo.x < 0) {
                        ammo = null; setTimeout(nextQuestion, 600);
                    }
                } else { drawCell(ammo.type, slingPos.x, slingPos.y, false); }
            }
            requestAnimationFrame(update);
        }
        initCitadel(); update();
    </script>
</body>
</html>
