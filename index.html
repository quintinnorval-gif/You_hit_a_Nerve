<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro-Sling: Citadel Defense</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 15px; border-radius: 12px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 380px; z-index: 100;
        }

        #rotate-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2196F3; color: white; z-index: 999; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        @media (orientation: portrait) {
            #rotate-notice { display: flex; }
        }

        button { 
            width: 100%; padding: 12px; margin: 5px 0; border: none; 
            border-radius: 8px; background: #2196F3; color: white; font-size: 16px; font-weight: bold; 
        }

        #ui { 
            position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: bold; 
            background: rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 5px; 
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <h1>Please Rotate Your Device</h1>
        <p>This game is best played in Landscape mode.</p>
    </div>

    <div id="ui">Integrity: <span id="block-count">0</span> | Ammo: <span id="ammo-name">-</span></div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startDefense()">Start Game</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1 style="color:#4CAF50">VICTORY!</h1>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        
        let screenW, screenH, scale;
        let slingPos = { x: 0, y: 0 }, mousePos = { x: 0, y: 0 };
        let blocks = [], ammo = null, particles = [], gameActive = true;
        let king = { x: 0, y: 0, r: 0, vy: 0 };

        function resize() {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            canvas.width = screenW;
            canvas.height = screenH;
            
            // Base scale on a "standard" height of 500px
            scale = Math.max(0.5, screenH / 500);
            
            slingPos.x = screenW * 0.15;
            slingPos.y = screenH - (80 * scale);
            king.r = 25 * scale;

            if (blocks.length === 0) initCitadel();
        }

        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 18, color: "#9c27b0", shape: "spider", power: 0.15 },
            ASTRO: { name: "Astrocyte", r: 15, color: "#ff9800", shape: "star", power: 0.18 },
            MICRO: { name: "Microglia", r: 12, color: "#f44336", shape: "pulse", power: 0.24 }
        };

        const questionPool = [
            { q: "Which cell creates myelin in the CNS?", a: ["Astrocyte", "Oligodendrocyte", "Microglia"], c: 1, type: "OLIGO" },
            { q: "The primary excitatory neurotransmitter is:", a: ["GABA", "Glutamate", "Glycine"], c: 1, type: "ASTRO" },
            { q: "Which lobe is responsible for vision?", a: ["Frontal", "Occipital", "Parietal"], c: 1, type: "ASTRO" },
            { q: "Immune defense in the brain is provided by:", a: ["Microglia", "Schwann Cells", "Ependymal"], c: 0, type: "MICRO" },
            { q: "Action potentials are triggered by an influx of:", a: ["Sodium", "Potassium", "Chloride"], c: 0, type: "OLIGO" },
            { q: "Which cell forms the Blood-Brain Barrier?", a: ["Ependymal", "Astrocyte", "Oligodendrocyte"], c: 1, type: "ASTRO" },
            { q: "CSF is produced by the:", a: ["Choroid Plexus", "Dura Mater", "Pia Mater"], c: 0, type: "ASTRO" },
            { q: "The emotional center of the brain is the:", a: ["Amygdala", "Cerebellum", "Basal Ganglia"], c: 0, type: "MICRO" },
            { q: "The 'Rest and Digest' system is:", a: ["Sympathetic", "Parasympathetic", "Somatic"], c: 1, type: "OLIGO" },
            { q: "Damage to Broca's area affects:", a: ["Hearing", "Speech Production", "Memory"], c: 1, type: "MICRO" }
        ];

        function initCitadel() {
            blocks = [];
            const cols = 2, layers = 5;
            const bW = 40 * scale, bH = 45 * scale;
            const startX = screenW - (screenW * 0.25);
            for(let i=0; i<layers; i++) {
                for(let j=0; j<cols; j++) {
                    blocks.push({ 
                        x: startX + (j * (bW + 5)), 
                        y: (screenH - 50) - (bH + 2) - (i * (bH + 2)), 
                        w: bW, h: bH, alive: true, col: j 
                    });
                }
            }
            updateUI();
        }

        function restoreBlock() {
            const counts = [
                blocks.filter(b => b.col === 0 && b.alive).length,
                blocks.filter(b => b.col === 1 && b.alive).length
            ];
            const targetCol = counts[0] <= counts[1] ? 0 : 1;
            const colBlocks = blocks.filter(b => b.col === targetCol && b.alive);
            const highestY = colBlocks.length > 0 ? Math.min(...colBlocks.map(b => b.y)) : screenH - 50;
            const bW = 40 * scale, bH = 45 * scale;

            blocks.push({ 
                x: (screenW - (screenW * 0.25)) + (targetCol * (bW + 5)), 
                y: highestY - (bH + 2), 
                w: bW, h: bH, alive: true, col: targetCol 
            });
            updateUI();
        }

        function nextQuestion() {
            if (!gameActive) return;
            const data = questionPool[Math.floor(Math.random() * questionPool.length)];
            quizBox.classList.remove('hidden');
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else { 
                        alert("Incorrect! The tower grows!");
                        restoreBlock();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function update() {
            ctx.clearRect(0, 0, screenW, screenH);
            ctx.fillStyle = "#5d4037"; ctx.fillRect(0, screenH - 50, screenW, 50);
            
            // Draw Sling
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 6 * scale; ctx.beginPath();
            ctx.moveTo(slingPos.x, screenH - 50); ctx.lineTo(slingPos.x, slingPos.y + (10 * scale)); ctx.stroke();

            // Block Physics
            let topY = screenH; let topBlock = null;
            blocks.forEach(b => {
                if(b.alive) {
                    ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#263238"; ctx.strokeRect(b.x, b.y, b.w, b.h);
                    if(b.y < topY) { topY = b.y; topBlock = b; }
                }
            });

            // King logic
            if(topBlock) {
                king.x = topBlock.x + (topBlock.w / 2);
                if(king.y < topBlock.y - (20 * scale)) { king.vy += 0.2; king.y += king.vy; }
                else { king.y = topBlock.y - (20 * scale); king.vy = 0; }
            } else { king.vy += 0.2; king.y += king.vy; }

            if (gameActive) {
                ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(king.x, king.y, king.r, 0, 7); ctx.fill();
                if(king.y > screenH - 60) {
                    gameActive = false;
                    document.getElementById('victory-box').classList.remove('hidden');
                }
            }

            // Ammo logic
            if(ammo && gameActive) {
                if(isDragging) {
                    ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.beginPath();
                    ctx.moveTo(slingPos.x, slingPos.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
                    drawCell(ammo.type, mousePos.x, mousePos.y);
                } else if(ammo.active) {
                    ammo.vy += 0.2; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) {
                            b.alive = false; updateUI();
                        }
                    });
                    if(ammo.y > screenH || ammo.x > screenW) { ammo = null; setTimeout(nextQuestion, 600); }
                } else { drawCell(ammo.type, slingPos.x, slingPos.y); }
            }
            requestAnimationFrame(update);
        }

        function drawCell(type, x, y) {
            ctx.fillStyle = type.color; ctx.beginPath();
            ctx.arc(x, y, type.r * scale, 0, 7); ctx.fill();
        }

        function updateUI() { document.getElementById('block-count').innerText = blocks.filter(b => b.alive).length; }

        // Interaction
        let isDragging = false;
        const startDrag = (e) => { if(!ammo || ammo.active) return; isDragging = true; };
        const moveDrag = (e) => {
            if(!isDragging) return;
            const t = e.touches ? e.touches[0] : e;
            mousePos = { x: t.clientX, y: t.clientY };
        };
        const endDrag = () => {
            if(!isDragging) return;
            isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.active = true;
        };

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', moveDrag);
        window.addEventListener('touchend', endDrag);

        function startDefense() { quizBox.classList.add('hidden'); nextQuestion(); }

        window.addEventListener('resize', resize);
        resize(); update();
    </script>
</body>
</html>
