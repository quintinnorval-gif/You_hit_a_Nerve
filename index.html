<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro-Sling: Citadel Defense Pro</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: linear-gradient(#87CEEB, #E0F7FA); }
        
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 85%; max-width: 450px; z-index: 100;
        }

        button { 
            width: 100%; padding: 16px; margin: 10px 0; border: none; 
            border-radius: 12px; background: #2196F3; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }

        .hidden { display: none !important; }
        #ui { position: absolute; top: 15px; left: 15px; font-weight: bold; pointer-events: none; background: rgba(255,255,255,0.8); padding: 12px; border-radius: 12px; border: 2px solid #2196F3; }
        #victory-box h1 { color: #4CAF50; margin-top: 0; }
    </style>
</head>
<body>

    <div id="ui">
        Citadel Integrity: <span id="block-count">0</span><br>
        Ammo: <span id="ammo-name">Awaiting Answer</span>
    </div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startDefense()">Initialize Defense</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1>VICTORY!</h1>
        <p>The King's citadel has been dismantled by your knowledge.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        const victoryBox = document.getElementById('victory-box');

        // VIRTUAL COORDINATE SYSTEM (The "Pro" Logic)
        const VW = 1000; 
        const VH = 600;
        let scale = 1;

        const GRAVITY = 0.22;
        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 24, color: "#9c27b0", shape: "spider", power: 0.13 },
            ASTRO: { name: "Astrocyte", r: 20, color: "#ff9800", shape: "star", power: 0.17 },
            MICRO: { name: "Microglia", r: 15, color: "#f44336", shape: "pulse", power: 0.23 }
        };

        const questionPool = [
            { q: "Which meningeal layer is in direct contact with the brain tissue?", a: ["Dura mater", "Arachnoid mater", "Pia mater"], c: 2, type: "OLIGO" },
            { q: "The subarachnoid space is located between:", a: ["Dura and Arachnoid", "Arachnoid and Pia", "Pia and Grey Matter"], c: 1, type: "ASTRO" },
            { q: "Which cell maintains the Blood-Brain Barrier (BBB)?", a: ["Astrocyte", "Oligodendrocyte", "Schwann cell"], c: 0, type: "ASTRO" },
            { q: "Phagocytic cells that act as brain immune defense are:", a: ["Satellite cells", "Microglia", "Ependymal cells"], c: 1, type: "MICRO" },
            { q: "Oligodendrocytes myelinate axons in the:", a: ["CNS", "PNS", "Enteric System"], c: 0, type: "OLIGO" },
            { q: "Sensory neurons in dorsal root ganglia are typically:", a: ["Pseudounipolar", "Multipolar", "Anaxonic"], c: 0, type: "MICRO" },
            { q: "Cranial Nerve X (10), which wanders to the thorax, is the:", a: ["Vagus", "Trigeminal", "Abducens"], c: 0, type: "MICRO" },
            { q: "The primary motor cortex is located in which lobe?", a: ["Frontal", "Parietal", "Occipital"], c: 0, type: "ASTRO" },
            { q: "Which structure connects the left and right hemispheres?", a: ["Thalamus", "Corpus Callosum", "Pons"], c: 1, type: "OLIGO" },
            { q: "Where is CSF primarily reabsorbed into the blood?", a: ["Choroid plexus", "Arachnoid villi", "Central canal"], c: 1, type: "OLIGO" }
        ];

        let shuffleDeck = [], particles = [], gameActive = true;
        let ammo = null, blocks = [], isDragging = false;
        let king = { x: 0, y: 0, r: 35, vy: 0 };
        let slingPos = { x: 180, y: VH - 150 };
        let mousePos = { x: 180, y: VH - 150 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scale = Math.min(canvas.width / VW, canvas.height / VH);
        }

        function toVirtual(realX, realY) {
            return {
                x: (realX - (canvas.width - VW * scale) / 2) / scale,
                y: (realY - (canvas.height - VH * scale) / 2) / scale
            };
        }

        function initCitadel() {
            blocks = []; king.vy = 0;
            const cols = 2, layers = 5;
            for(let i=0; i<layers; i++) {
                for(let j=0; j<cols; j++) {
                    blocks.push({ x: VW - 250 + (j*62), y: VH - 110 - (i*60), w: 55, h: 58, alive: true, col: j });
                }
            }
            updateUI();
        }

        function restoreBlock() {
            const counts = [
                blocks.filter(b => b.col === 0 && b.alive).length,
                blocks.filter(b => b.col === 1 && b.alive).length
            ];
            const targetCol = counts[0] <= counts[1] ? 0 : 1;
            const colBlocks = blocks.filter(b => b.col === targetCol && b.alive);
            const highestY = colBlocks.length > 0 ? Math.min(...colBlocks.map(b => b.y)) : VH - 50;

            blocks.push({ x: VW - 250 + (targetCol * 62), y: highestY - 60, w: 55, h: 58, alive: true, col: targetCol });
            updateUI();
        }

        function drawCell(type, x, y, isAngry) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = type.color; ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.beginPath();
            if(type.shape === "spider") {
                for(let i=0; i<8; i++) {
                    let a = (i/8)*Math.PI*2 + (isAngry ? Date.now()*0.01 : 0);
                    ctx.lineTo(Math.cos(a)*type.r*1.4, Math.sin(a)*type.r*1.4); ctx.lineTo(0,0);
                }
            } else if(type.shape === "star") {
                for(let i=0; i<10; i++) {
                    let a = (i/10)*Math.PI*2; let r = i%2===0 ? type.r : type.r/2;
                    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                }
            } else { ctx.arc(0, 0, type.r, 0, Math.PI*2); }
            ctx.fill(); ctx.stroke();

            // Eyes
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(-type.r/3, -type.r/5, type.r/6, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(type.r/3, -type.r/5, type.r/6, 0, 7); ctx.fill();
            ctx.restore();
        }

        function drawKing(k) {
            ctx.save();
            ctx.translate(k.x, k.y);
            // Body
            ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(0, 0, k.r, 0, 7); ctx.fill();
            // Crown
            ctx.fillStyle = "gold"; ctx.beginPath();
            ctx.moveTo(-20, -30); ctx.lineTo(-25, -50); ctx.lineTo(-10, -40); 
            ctx.lineTo(0, -55); ctx.lineTo(10, -40); ctx.lineTo(25, -50); ctx.lineTo(20, -30);
            ctx.closePath(); ctx.fill();
            // Face
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(-12, -5, 8, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(12, -5, 8, 0, 7); ctx.fill();
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(-12, -5, 3, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(12, -5, 3, 0, 7); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 15, 10, 3.8, 5.6); ctx.stroke();
            ctx.restore();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            // Center the virtual stage on the real screen
            ctx.translate((canvas.width - VW * scale) / 2, (canvas.height - VH * scale) / 2);
            ctx.scale(scale, scale);

            // Ground
            ctx.fillStyle = "#5d4037"; ctx.fillRect(-500, VH - 50, VW + 1000, 500);

            // Slingshot Base
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 12; ctx.beginPath();
            ctx.moveTo(slingPos.x, VH - 50); ctx.lineTo(slingPos.x, slingPos.y + 25); ctx.stroke();

            // Physics for blocks
            blocks.forEach(b => {
                if(b.alive) {
                    let colItems = blocks.filter(bl => bl.col === b.col && bl.alive).sort((a,b) => b.y - a.y);
                    let idx = colItems.indexOf(b);
                    let targetY = VH - 110 - (idx * 60);
                    if (b.y < targetY) b.y += 6; else b.y = targetY;
                    
                    ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = "#263238"; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
                }
            });

            // King Logic
            let topBlock = blocks.filter(b => b.alive).sort((a,b) => a.y - b.y)[0];
            if(topBlock) {
                king.x = topBlock.x + 28;
                if(king.y < topBlock.y - 45) { king.vy += GRAVITY; king.y += king.vy; }
                else { king.y = topBlock.y - 45; king.vy = 0; }
            } else { king.vy += GRAVITY; king.y += king.vy; }
            
            if (gameActive) drawKing(king);
            if (gameActive && king.y >= VH - 85) triggerExplosion();

            // Ammo & Slingshot Elastic
            if(ammo && gameActive) {
                if(isDragging) {
                    let vx = (slingPos.x - mousePos.x) * ammo.type.power;
                    let vy = (slingPos.y - mousePos.y) * ammo.type.power;
                    
                    // Prediction Line
                    ctx.beginPath(); ctx.setLineDash([5, 8]); ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                    let px = slingPos.x, py = slingPos.y, pvx = vx, pvy = vy;
                    for(let i=0; i<45; i++) {
                        ctx.lineTo(px, py); pvy += GRAVITY; px += pvx; py += pvy;
                        if(py > VH - 50) break;
                    }
                    ctx.stroke(); ctx.setLineDash([]);

                    // Rubber Band
                    ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 4; ctx.beginPath();
                    ctx.moveTo(slingPos.x, slingPos.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
                    drawCell(ammo.type, mousePos.x, mousePos.y, false);
                } else if(ammo.active) {
                    ammo.vy += GRAVITY; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y, true);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) {
                            b.alive = false; updateUI();
                        }
                    });
                    if(ammo.y > VH || ammo.x > VW || ammo.x < 0) {
                        ammo = null; setTimeout(nextQuestion, 600);
                    }
                } else { drawCell(ammo.type, slingPos.x, slingPos.y, false); }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.y > VH) particles.splice(i, 1);
            });

            ctx.restore();
            requestAnimationFrame(update);
        }

        // INPUT HANDLING
        function handleDown(e) {
            if(!gameActive || !ammo || ammo.launched) return;
            const pos = toVirtual(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);
            if(Math.hypot(pos.x - slingPos.x, pos.y - slingPos.y) < 60) isDragging = true;
        }

        function handleMove(e) {
            if(!isDragging) return;
            mousePos = toVirtual(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);
        }

        function handleUp() {
            if(!isDragging) return;
            isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.launched = true; ammo.active = true;
        }

        canvas.addEventListener('mousedown', handleDown);
        canvas.addEventListener('touchstart', handleDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchend', handleUp);

        function startDefense() { quizBox.classList.add('hidden'); initCitadel(); nextQuestion(); }
        function resetGame() { location.reload(); }
        function updateUI() { document.getElementById('block-count').innerText = blocks.filter(b => b.alive).length; }

        function nextQuestion() {
            if (!gameActive) return;
            if (shuffleDeck.length === 0) shuffleDeck = [...questionPool].sort(() => Math.random() - 0.5);
            quizBox.classList.remove('hidden');
            const data = shuffleDeck.pop();
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, launched:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else {
                        restoreBlock();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function triggerExplosion() {
            gameActive = false;
            for(let i=0; i<120; i++) {
                particles.push({
                    x: king.x, y: king.y,
                    vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18,
                    size: Math.random() * 6 + 2, color: `hsl(${Math.random() * 360}, 80%, 60%)`
                });
            }
            setTimeout(() => { victoryBox.classList.remove('hidden'); }, 1500);
        }

        window.addEventListener('resize', resize);
        resize(); update();
    </script>
</body>
</html>
