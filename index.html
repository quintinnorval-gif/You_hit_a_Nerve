<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro-Sling: Citadel Defense Pro</title>
    <style>
        body { margin: 0; background: #87CEEB; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #quiz-box, #victory-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 85%; max-width: 400px; z-index: 100;
        }
        button { 
            width: 100%; padding: 15px; margin: 8px 0; border: none; 
            border-radius: 12px; background: #2196F3; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .hidden { display: none !important; }
        #ui { position: absolute; top: 15px; left: 15px; font-weight: bold; pointer-events: none; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; border: 2px solid #2196F3; }
    </style>
</head>
<body>

    <div id="ui">
        Citadel Integrity: <span id="block-count">0</span><br>
        Ammo: <span id="ammo-name">Awaiting Answer</span>
    </div>

    <div id="quiz-box">
        <h2 id="question">Neuro-Sling Academy</h2>
        <div id="options"><button onclick="startGame()">Start Mission</button></div>
    </div>

    <div id="victory-box" class="hidden">
        <h1 style="color:#4CAF50">MISSION SUCCESS</h1>
        <p>The King has been dethroned!</p>
        <button onclick="resetGame()">Re-deploy</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quizBox = document.getElementById('quiz-box');
        const victoryBox = document.getElementById('victory-box');

        const VW = 1000, VH = 600;
        let scale = 1, gameStatus = "START"; // START, PLAYING, EXPLODING, WON
        
        const GRAVITY = 0.22;
        const CELL_TYPES = {
            OLIGO: { name: "Oligodendrocyte", r: 22, color: "#9c27b0", shape: "spider", power: 0.14 },
            ASTRO: { name: "Astrocyte", r: 20, color: "#ff9800", shape: "star", power: 0.18 },
            MICRO: { name: "Microglia", r: 16, color: "#f44336", shape: "pulse", power: 0.24 }
        };

        const questionPool = [
            { q: "Which meningeal layer is in direct contact with the brain?", a: ["Dura", "Arachnoid", "Pia"], c: 2, type: "OLIGO" },
            { q: "The subarachnoid space contains:", a: ["Blood", "CSF", "Air"], c: 1, type: "ASTRO" },
            { q: "Which cell maintains the Blood-Brain Barrier?", a: ["Astrocyte", "Microglia", "Neuron"], c: 0, type: "ASTRO" },
            { q: "Which cell produces myelin in the CNS?", a: ["Schwann", "Oligodendrocyte", "Astrocyte"], c: 1, type: "OLIGO" },
            { q: "Phagocytic immune cells of the brain:", a: ["Microglia", "Ependymal", "Satellite"], c: 0, type: "MICRO" }
        ];

        let blocks = [], particles = [], ammo = null, shuffleDeck = [];
        let isDragging = false, mousePos = {x:0, y:0};
        let king = { x: 0, y: 0, r: 30, vy: 0 };
        const slingPos = { x: 150, y: VH - 180 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scale = Math.min(canvas.width / VW, canvas.height / VH);
        }

        function toVirtual(rx, ry) {
            return {
                x: (rx - (canvas.width - VW * scale) / 2) / scale,
                y: (ry - (canvas.height - VH * scale) / 2) / scale
            };
        }

        function startGame() {
            gameStatus = "PLAYING";
            quizBox.classList.add('hidden');
            initLevel();
            nextQuestion();
        }

        function resetGame() {
            location.reload(); // Hard reset to ensure all loops stop
        }

        function initLevel() {
            blocks = [];
            particles = [];
            king.vy = 0;
            for(let i=0; i<5; i++) {
                for(let j=0; j<2; j++) {
                    blocks.push({ x: VW-250+(j*65), y: -100 - (i*60), w: 55, h: 55, alive: true, col: j });
                }
            }
            updateUI();
        }

        function nextQuestion() {
            if (gameStatus !== "PLAYING") return;
            if (shuffleDeck.length === 0) shuffleDeck = [...questionPool].sort(() => Math.random() - 0.5);
            
            quizBox.classList.remove('hidden');
            const data = shuffleDeck.pop();
            document.getElementById('question').innerText = data.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            
            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === data.c) {
                        quizBox.classList.add('hidden');
                        ammo = { x: slingPos.x, y: slingPos.y, vx:0, vy:0, active:false, type: CELL_TYPES[data.type] };
                        document.getElementById('ammo-name').innerText = ammo.type.name;
                    } else {
                        addReinforcement();
                        nextQuestion();
                    }
                };
                opts.appendChild(btn);
            });
        }

        function addReinforcement() {
            const counts = [blocks.filter(b=>b.col===0 && b.alive).length, blocks.filter(b=>b.col===1 && b.alive).length];
            const col = counts[0] <= counts[1] ? 0 : 1;
            blocks.push({ x: VW-250+(col*65), y: -50, w: 55, h: 55, alive: true, col: col });
            updateUI();
        }

        function triggerExplosion() {
            gameStatus = "EXPLODING";
            for(let i=0; i<80; i++) {
                particles.push({
                    x: king.x, y: king.y,
                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                    size: Math.random()*5+2, color: `hsl(${Math.random()*360}, 70%, 60%)`
                });
            }
            setTimeout(() => { 
                gameStatus = "WON";
                victoryBox.classList.remove('hidden'); 
            }, 1200);
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate((canvas.width - VW*scale)/2, (canvas.height - VH*scale)/2);
            ctx.scale(scale, scale);

            // Scenery
            ctx.fillStyle = "#4caf50"; ctx.fillRect(-500, VH-50, VW+1000, 500); // Ground
            ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 10; ctx.beginPath();
            ctx.moveTo(slingPos.x, VH-50); ctx.lineTo(slingPos.x, slingPos.y+20); ctx.stroke();

            // Block Physics
            blocks.forEach(b => {
                if(!b.alive) return;
                const colBlocks = blocks.filter(bl => bl.col === b.col && bl.alive).sort((a,b) => b.y - a.y);
                const targetY = VH - 105 - (colBlocks.indexOf(b)*58);
                if(b.y < targetY) b.y += 8; else b.y = targetY;
                
                ctx.fillStyle = "#78909c"; ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = "#263238"; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            // King Logic
            const top = blocks.filter(b=>b.alive).sort((a,b)=>a.y-b.y)[0];
            if(top) {
                king.x = top.x + 27;
                if(king.y < top.y - 35) { king.vy += GRAVITY; king.y += king.vy; }
                else { king.y = top.y - 35; king.vy = 0; }
            } else {
                king.vy += GRAVITY; king.y += king.vy;
            }

            if(gameStatus === "PLAYING" || gameStatus === "EXPLODING") {
                // Draw King
                ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(king.x, king.y, king.r, 0, 7); ctx.fill();
                ctx.fillStyle = "gold"; ctx.fillRect(king.x-10, king.y-40, 20, 10); // Simple crown
                if(gameStatus === "PLAYING" && king.y > VH-80) triggerExplosion();
            }

            // Ammo
            if(ammo && gameStatus === "PLAYING") {
                if(isDragging) {
                    ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 3; ctx.beginPath();
                    ctx.moveTo(slingPos.x, slingPos.y); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
                    drawCell(ammo.type, mousePos.x, mousePos.y);
                } else if(ammo.active) {
                    ammo.vy += GRAVITY; ammo.x += ammo.vx; ammo.y += ammo.vy;
                    drawCell(ammo.type, ammo.x, ammo.y);
                    blocks.forEach(b => {
                        if(b.alive && ammo.x > b.x && ammo.x < b.x+b.w && ammo.y > b.y && ammo.y < b.y+b.h) {
                            b.alive = false; updateUI();
                        }
                    });
                    if(ammo.y > VH || ammo.x > VW || ammo.x < 0) { ammo = null; setTimeout(nextQuestion, 600); }
                } else {
                    drawCell(ammo.type, slingPos.x, slingPos.y);
                }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.y > VH) particles.splice(i,1);
            });

            ctx.restore();
            requestAnimationFrame(update);
        }

        function drawCell(t, x, y) {
            ctx.fillStyle = t.color; ctx.beginPath();
            if(t.shape === "star") {
                for(let i=0; i<10; i++) {
                    let r = i%2===0 ? t.r : t.r/2;
                    ctx.lineTo(x + Math.cos(i*0.62)*r, y + Math.sin(i*0.62)*r);
                }
            } else if(t.shape === "spider") {
                for(let i=0; i<8; i++) {
                    ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(i*0.78)*t.r*1.4, y+Math.sin(i*0.78)*t.r*1.4);
                }
                ctx.arc(x,y, t.r*0.8, 0, 7);
            } else { ctx.arc(x,y, t.r, 0, 7); }
            ctx.fill(); ctx.stroke();
        }

        canvas.addEventListener('mousedown', e => {
            if(gameStatus !== "PLAYING" || !ammo) return;
            const p = toVirtual(e.clientX, e.clientY);
            if(Math.hypot(p.x-slingPos.x, p.y-slingPos.y) < 50) isDragging = true;
        });
        window.addEventListener('mousemove', e => { if(isDragging) mousePos = toVirtual(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => {
            if(!isDragging) return;
            isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.active = true;
        });

        // Touch support
        canvas.addEventListener('touchstart', e => {
            if(gameStatus !== "PLAYING" || !ammo) return;
            const p = toVirtual(e.touches[0].clientX, e.touches[0].clientY);
            if(Math.hypot(p.x-slingPos.x, p.y-slingPos.y) < 50) isDragging = true;
        });
        window.addEventListener('touchmove', e => { if(isDragging) mousePos = toVirtual(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => {
            if(!isDragging) return;
            isDragging = false;
            ammo.vx = (slingPos.x - mousePos.x) * ammo.type.power;
            ammo.vy = (slingPos.y - mousePos.y) * ammo.type.power;
            ammo.active = true;
        });

        function updateUI() { document.getElementById('block-count').innerText = blocks.filter(b=>b.alive).length; }
        window.addEventListener('resize', resize);
        resize(); update();
    </script>
</body>
</html>
